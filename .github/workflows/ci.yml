name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Tests run in the same pinned Go/Alpine base as the image build, with
      # Alpine's FFmpeg, so they do not depend on the runner's apt mirror.
      - name: Unit, race and real-media tests
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            golang:1.27.3-alpine3.24@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c \
            sh -c 'apk add --no-cache build-base ffmpeg >/dev/null && go vet ./... && CGO_ENABLED=1 go test -race -count=1 ./...'
      - name: Validate API contract
        run: |
          python3 -m venv /tmp/contract-check
          /tmp/contract-check/bin/pip install openapi-spec-validator==0.7.2
          /tmp/contract-check/bin/python scripts/check-contract.py
      - name: Build hardened container
        run: docker build --pull -t ffmpeg-service:test .
      - name: Container, API and confinement checks
        timeout-minutes: 15
        run: sh scripts/container-smoke.sh ffmpeg-service:test
      - name: Collect image manifest
        run: |
          mkdir -p dist
          docker image inspect ffmpeg-service:test > dist/image-inspect.json
          docker run --rm --entrypoint cat ffmpeg-service:test /usr/share/ffmpeg-service/packages.txt > dist/packages.txt
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ffmpeg-service:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ffmpeg-service:test
          format: cyclonedx
          output: dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.runner }}
          path: dist/
