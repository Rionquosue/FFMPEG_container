name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install fixture tools
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Unit, race and real-media tests
        run: make test
      - name: Validate API contract
        run: |
          python3 -m venv /tmp/contract-check
          /tmp/contract-check/bin/pip install openapi-spec-validator==0.7.2
          /tmp/contract-check/bin/python scripts/check-contract.py
      - name: Build hardened container
        run: docker build --pull -t ffmpeg-service:test .
      - name: Container, API and confinement checks
        timeout-minutes: 15
        run: sh scripts/container-smoke.sh ffmpeg-service:test
      - name: Collect image manifest
        run: |
          mkdir -p dist
          docker image inspect ffmpeg-service:test > dist/image-inspect.json
          docker run --rm --entrypoint cat ffmpeg-service:test /usr/share/ffmpeg-service/packages.txt > dist/packages.txt
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ffmpeg-service:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ffmpeg-service:test
          format: cyclonedx
          output: dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.runner }}
          path: dist/
