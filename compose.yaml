services:
  ffmpeg:
    build: .
    image: ffmpeg-service:0.1.0
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    init: true
    stop_grace_period: 20s
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=1073741824,uid=10001,gid=10001,mode=0700
    environment:
      HTTP_ADDR: ":8080"
      WORK_DIR: /work
      API_KEYS_FILE: /run/secrets/api_keys
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-268435456}"
      MAX_OUTPUT_BYTES: "${MAX_OUTPUT_BYTES:-268435456}"
      STORAGE_BUDGET_BYTES: "${STORAGE_BUDGET_BYTES:-805306368}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-1}"
      MAX_RETAINED_JOBS: "${MAX_RETAINED_JOBS:-2}"
      MAX_JOBS_PER_CONSUMER: "${MAX_JOBS_PER_CONSUMER:-2}"
      MAX_JOB_RECORDS: "1000"
      MAX_DURATION_SECONDS: "${MAX_DURATION_SECONDS:-600}"
      MAX_PIXELS: "${MAX_PIXELS:-16777216}"
      PROCESS_TIMEOUT_SECONDS: "${PROCESS_TIMEOUT_SECONDS:-120}"
      UPLOAD_TIMEOUT_SECONDS: "120"
      JOB_TTL_SECONDS: "${JOB_TTL_SECONDS:-900}"
      TOMBSTONE_TTL_SECONDS: "900"
    secrets:
      - api_keys
    networks:
      - media_processing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  api_keys:
    file: ${API_KEYS_PATH:-./secrets/api_keys.json}

networks:
  media_processing:
    external: true
    name: ${MEDIA_NETWORK:-media_processing}
